<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NX036">
  <!--
    Icono de la pestaña. Es el MISMO símbolo que la cabecera del sitio (circle-nodes) y el azul de marca
    (color brand 500, #1355a6), para que la pestaña se reconozca de un vistazo entre veinte abiertas.

    Existe porque faltaba: root.tsx enlazaba /favicon.svg y el fichero no estaba en public/, así que cada
    carga de página devolvia un 404 en los tres entornos y el navegador no mostraba icono. Se perdio al
    migrar a SSR, cuando se elimino el index.html que lo acompanaba.

    Va con fondo redondeado en vez del glifo suelto: sobre la barra clara de Chrome un trazo fino del
    mismo azul se pierde, y el circulo le da contraste sea cual sea el tema del navegador.
  -->
  <rect width="512" height="512" rx="96" fill="#1355a6"/>
  <g transform="translate(64 64) scale(0.75)">
    <path d="M418.4 157.9c35.3-8.3 61.6-40 61.6-77.9c0-44.2-35.8-80-80-80c-43.4 0-78.7 34.5-80 77.5L136.2 151.1C121.7 136.8 101.9 128 80 128c-44.2 0-80 35.8-80 80s35.8 80 80 80c12.2 0 23.8-2.7 34.1-7.6L259.7 407.8c-2.4 7.6-3.7 15.8-3.7 24.2c0 44.2 35.8 80 80 80s80-35.8 80-80c0-27.7-14-52.1-35.4-66.4l37.8-207.7zM156.3 232.2c2.2-6.9 3.5-14.2 3.7-21.7l183.8-73.5c3.6 3.5 7.4 6.7 11.6 9.5L317.6 354.1c-5.5 1.3-10.8 3.1-15.8 5.5L156.3 232.2z" fill="#ffffff"/>
  </g>
</svg>
