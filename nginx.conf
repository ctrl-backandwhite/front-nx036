# Pasarela del escaparate (Angular).
#
# Clon del `nginx.conf` del frontend de React, con UNA diferencia de fondo que explica
# todas las demás: aquí NO hay servidor Node.
#
#   · React renderiza en servidor: su nginx actual ya no sirve ficheros, solo reenvía a un
#     proceso `react-router-serve` que escucha en el 3000 dentro del mismo pod.
#   · Angular se construye con `outputMode: static`: el resultado son ficheros estáticos
#     más el HTML ya pintado de las rutas prerenderizadas. Nginx los sirve DIRECTAMENTE.
#
# Por eso este fichero se calca de la versión de React ANTERIOR al renderizado en servidor
# (commit 88e4168^), que es la que servía ficheros con `root` y `try_files`. Los bloques de
# proxy (`/api/`, `/oauth2/`, `/login/oauth2/`, `/.well-known/`) son idénticos en las dos
# versiones de React y se copian tal cual: cada regla salió de una avería concreta y la
# explicación viaja con ella.
#
# DÓNDE VIVE: en la imagen de React el fichero va a `/app/nginx.conf` y un contenedor de
# inicio lo copia a un sidecar de nginx, porque allí quien sirve es Node. Aquí la imagen
# final YA ES nginx, así que el Dockerfile lo deja directamente en
# `/etc/nginx/conf.d/default.conf` (sustituyendo la configuración de ejemplo del puerto 80,
# que si no quedaría publicando la misma carpeta sin ninguna de estas reglas).

# ── Etiquetas para compartir de la ficha de producto ────────────────────────────────
#
# Quien pega el enlace de una ficha en WhatsApp o una red social no abre la página: un robot pide el
# HTML y lee las etiquetas `og:`. Esos robots NO ejecutan JavaScript, y nuestras etiquetas las pone la
# aplicación al montar la ficha, así que llegaban tarde SIEMPRE: cada enlace compartido salía con el
# título genérico del sitio y sin foto.
#
# Se resuelve aquí, en la pasarela, y no prerenderizando: hay 7.729 productos, el catálogo crece entre
# despliegues y la ficha depende del idioma y la divisa de quien mira. El porqué completo, medido, está
# en la cabecera de `seo-ficha.js`.
js_import seo from /etc/nginx/njs/seo-ficha.js;

server {
    listen 3003;
    server_name _;
    root /usr/share/nginx/html;

    # ── Compresión ──────────────────────────────────────────────────────────────────────
    #
    # No estaba, y era la diferencia más grande que quedaba contra el front anterior: aquí se servía
    # la hoja de estilos entera, 264 kB, y el HTML de la portada, 466 kB, tal cual. El otro front los
    # entrega comprimidos con brotli en 37 kB y 12 kB. No era que el porte pesara más: es que no se
    # comprimía nada, y eso además falseaba las medidas de rendimiento de la certificación.
    #
    # `gzip_static` sirve el `.gz` que se genera AL CONSTRUIR, con el nivel máximo. Es mejor que
    # comprimir en cada petición: comprime una vez, aprieta más y no gasta procesador por visita. Si
    # el `.gz` no existe para un fichero, `gzip on` lo comprime al vuelo.
    #
    # Brotli no está: la imagen oficial de nginx no trae su módulo para Alpine. En producción lo pone
    # Cloudflare, que recomprime lo que le llega. Por eso el `.gz` es la red de seguridad del origen.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/rss+xml
        application/manifest+json image/svg+xml font/ttf font/otf;
    index index.html;

    # Anti-clonado: bloquea crawlers de IA/entrenamiento y scrapers SEO conocidos (por user-agent).
    # NO incluye Googlebot/Bingbot (para conservar SEO) ni clientes genéricos curl/python/Go
    # (los usan integraciones de partners autenticadas por JWT). Los scrapers con UA de navegador
    # los frena el rate limit del backend.
    if ($http_user_agent ~* "(GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|Claude-Web|anthropic-ai|CCBot|Google-Extended|PerplexityBot|Perplexity-User|Bytespider|Amazonbot|Applebot-Extended|Meta-ExternalAgent|FacebookBot|Diffbot|DataForSeoBot|ImagesiftBot|Omgilibot|cohere-ai|YouBot|AI2Bot|Timpibot|Webzio|AhrefsBot|SemrushBot|MJ12bot|DotBot|BLEXBot|PetalBot|MauiBot|SeekportBot|serpstatbot|magpie-crawler)") {
        return 403;
    }

    # robots.txt servido directo con tipo correcto y caché corta.
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Los ficheros con hash en el nombre son inmutables: se cachean agresivamente.
    #
    # ADAPTACIÓN: el React tenía aquí `location /assets/`, porque Vite mete todo lo
    # construido en esa carpeta. Angular NO: deja los trozos con hash en la RAÍZ de la
    # salida (`main-65LUOBUI.js`, `styles-DPQF443V.css`) y solo lo referenciado desde CSS
    # baja a `media/`. Un `location /assets/` aquí no casaría con nada y todo el JavaScript
    # se serviría sin caché.
    #
    # Se casa por tanto el PATRÓN DEL HASH, no la carpeta. Y a propósito con `~` y no con
    # `~*`: el hash de Angular es base32 en MAYÚSCULAS, así que distinguir mayúsculas evita
    # que un fichero puesto a mano en `public/` cuyo nombre acabe en ocho letras
    # minúsculas (`algo-tracking.js`) se quede cacheado un año por accidente.
    #
    # Si algún día Angular cambiara el largo del hash, estos ficheros dejarían de casar y
    # caerían en el `location /` de abajo: se servirían SIN caché. Se rompe hacia el lado
    # seguro —más lento, nunca rancio—, que es lo que se quiere en una regla de caché.
    #
    # Un aviso sobre el orden, porque no es el del fichero: nginx prueba los `location`
    # con expresión regular ANTES que los de prefijo, así que este bloque se mira antes
    # que `/api/` y compañía. Es inofensivo —ninguna ruta del backend termina en guion,
    # ocho mayúsculas y una extensión de estático—, pero conviene saberlo antes de añadir
    # extensiones a la lista de arriba.
    location ~ "-[A-Z0-9]{8}\.(js|mjs|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|map)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # El HTML nunca se cachea: así el navegador siempre toma el documento nuevo tras un
    # despliegue y referencia los hashes de chunk vigentes (evita "Failed to fetch
    # dynamically imported module" por un index.html obsoleto en caché).
    #
    # ┌── DECISIÓN PENDIENTE DE CONFIRMAR ─────────────────────────────────────────────┐
    # │ Esta línea se copia del React tal cual, porque así se pidió al crear el         │
    # │ fichero. Pero CHOCA con el apartado 6 del CLAUDE.md de este proyecto, que dice  │
    # │ que el HTML público prerenderizado lo sirve nginx «como fichero estático, que   │
    # │ Cloudflare cachea en el nodo más cercano», y que ESE es el motivo de haber      │
    # │ apagado el renderizado en servidor. Con `no-store` Cloudflare no puede guardar  │
    # │ nada y esa ventaja no llega a existir.                                          │
    # │                                                                                 │
    # │ De los dos motivos que tenía el React para el `no-store`, aquí solo queda uno:  │
    # │   · «la misma dirección devuelve una página distinta a cada visitante» porque   │
    # │     el renderizador leía la cookie de idioma/moneda/tema. YA NO APLICA: el      │
    # │     prerenderizado genera un HTML idéntico para todos y el idioma se aplica al  │
    # │     hidratar, en el navegador.                                                  │
    # │   · el documento rancio que apunta a hashes de chunk ya borrados. SIGUE         │
    # │     APLICANDO, y es real.                                                       │
    # │                                                                                 │
    # │ Ese segundo motivo se cubre con `no-cache` A SECAS, que no es lo mismo que      │
    # │ `no-store`: permite guardar el documento en el borde pero obliga a revalidarlo  │
    # │ contra el origen antes de reutilizarlo. Es decir, el cambio sería quitar        │
    # │ `no-store` de la línea de abajo. No se hace aquí por su cuenta porque cambia    │
    # │ el comportamiento en producción; que lo decida quien lleve el rendimiento.      │
    # └─────────────────────────────────────────────────────────────────────────────────┘
    #
    # ADAPTACIÓN del `try_files`. El React caía en `/index.html` porque su salida era un
    # único documento. Con `outputMode: static` Angular genera DOS cosas distintas:
    #   · `index.html`      la portada YA PRERENDERIZADA (y `<ruta>/index.html` para cada
    #                       ruta que se añada a la lista de prerenderizado).
    #   · `index.csr.html`  el esqueleto vacío, para las rutas que NO se prerenderizan.
    # El orden `$uri $uri/index.html /index.csr.html` los cubre en ese orden: fichero exacto,
    # luego el HTML prerenderizado de esa carpeta y, si no hay ninguno, el esqueleto.
    #
    # Se apunta al `index.html` de la carpeta y NO a la carpeta (`$uri/`) porque nginx, ante una
    # carpeta sin barra final, responde 301 para añadírsela. Es decir: `/login` devolvía un salto
    # a `/login/` en vez de la página, y lo mismo TODAS las rutas prerenderizadas. Un salto de más
    # por página, con Cloudflare delante y con una dirección distinta de la que enseña el front
    # anterior, que sirve `/login` con un 200 limpio. Caer en `/index.html` como hace el React serviría a
    # `/producto/123` el HTML prerenderizado de la PORTADA, y la hidratación de Angular
    # chocaría con un DOM que no es el suyo.
    # La FICHA de producto pasa por njs para que su `<head>` salga completo. Va antes que el
    # `location /` porque nginx prueba las expresiones regulares primero y en orden de aparición.
    # No casa con `/catalog` a secas —el listado— porque exige una barra y algo detrás.
    location ~ "^/catalog/[^/]+/?$" {
        js_content seo.ficha;
    }

    # De dónde saca njs los datos. Es `internal`, así que nadie puede pedirla desde fuera: solo
    # existe para la subpetición. La ficha suelta es pública, así que no viaja ninguna credencial.
    location /_ficha_para_compartir/ {
        internal;
        # El tamaño del buffer de la subpetición. Sin esto, njs corta cualquier respuesta que pase del
        # tamaño de página —4 kB— con «too big subrequest response» y la ficha se queda SIN SERVIR:
        # respuesta vacía, no un fallo visible. La ficha de ejemplo ocupa 8 kB, y una con muchas
        # variantes e imágenes pasa holgadamente de eso, así que se da margen de sobra: es memoria por
        # petición en curso, y estas duran milisegundos.
        subrequest_output_buffer_size 512k;
        proxy_pass http://backend:18082/api/catalog/products/;
        proxy_set_header Host $host;
        # Plazos cortos a propósito: esto adorna el `<head>`, no puede hacer esperar a quien ha
        # pulsado el enlace. Si el backend no contesta en tres segundos, se sirve el HTML de siempre.
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # La salida de emergencia de njs: si no puede leer la plantilla, se sirve el esqueleto de siempre.
    location @aplicacion {
        try_files /index.csr.html =404;
    }

    location / {
        try_files $uri $uri/index.html /index.csr.html;
        add_header Cache-Control "no-cache";   # DECIDIDO 6-sep-2026: se cachea en el borde, revalidando.
        #  `no-cache` NO significa «no guardes»: significa «guarda, pero pregunta antes de servir».
        #  Es justo lo que hace falta aquí. El HTML ahora se genera al construir y es el MISMO para
        #  todo el mundo, así que Cloudflare puede tenerlo en el nodo más cercano —que era el motivo
        #  entero de apagar el renderizado en servidor— y aun así nadie recibe un documento rancio
        #  apuntando a fragmentos de JavaScript que ya no existen: cada visita lo revalida contra el
        #  origen, y una revalidación que responde 304 no descarga nada.
    }

    location /api/ {
        proxy_pass http://backend:18082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Operaciones de mantenimiento del admin (p.ej. "Sincronizar" = reindexar TODO el catálogo)
        # son síncronas y crecen con el catálogo: con 5000+ productos superan el timeout por defecto
        # de nginx (60s) y devolvían 504 ("No se pudo reindexar"). Damos margen amplio (10 min).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # La importación masiva de productos manda LOTES de fichas completas: descripciones en ocho
        # idiomas, variantes y listas de imágenes. Un lote de 100 pasa del megabyte que nginx acepta por
        # defecto, y nginx lo rechaza con 413 ANTES de tocar el backend —que sí lo aceptaba (10 MB en
        # `spring.servlet.multipart.max-request-size`)—. Ese es el motivo por el que reimportar lo
        # exportado daba «19 creados, 200 fallidos»: los dos lotes grandes se caían enteros y solo
        # entraba el último, que era corto. Se sube al mismo orden que aguanta el backend.
        client_max_body_size 20m;
        # La API nunca debe indexarse ni usarse para entrenamiento de IA.
        add_header X-Robots-Tag "noindex, nofollow, noai, noimageai" always;
    }

    location /oauth2/ {
        proxy_pass http://backend:18082/oauth2/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # $http_host keeps the port (localhost:3003); X-Forwarded-Port makes Tomcat build
        # absolute redirects (e.g. the post-login redirect to "/") with the right port.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # OAuth2 callback (Google redirects here); /login itself stays an SPA route.
    location /login/oauth2/ {
        proxy_pass http://backend:18082/login/oauth2/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /.well-known/ {
        proxy_pass http://backend:18082/.well-known/;
    }
}
